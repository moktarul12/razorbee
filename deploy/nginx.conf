server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Keep Location headers relative so HTTPS frontends stay on https://
  absolute_redirect off;

  # Clean URLs: /index.html → /  and  /about.html → /about
  location = /index.html {
    return 301 /;
  }
  location ~ ^/(.+)\.html$ {
    return 301 /$1$is_args$args;
  }

  # Serve /index.html as a file for "/" so the /index.html → / redirect
  # does not loop (index module would otherwise re-enter that location).
  location / {
    try_files $uri $uri.html $uri/index.html =404;
  }

  location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
  }

  add_header X-Frame-Options "DENY";
  add_header X-Content-Type-Options "nosniff";
  add_header Referrer-Policy "strict-origin-when-cross-origin";
}
